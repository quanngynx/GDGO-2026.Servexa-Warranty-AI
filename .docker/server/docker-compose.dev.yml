services:
  postgres:
    # Error: in 18+, these Docker images are configured to store database data in a
    #  format which is compatible with "pg_ctlcluster" (specifically, using
    #  major-version-specific directory names).  This better reflects how
    #  PostgreSQL itself works, and how upgrades are to be performed.
    #  See also https://github.com/docker-library/postgres/pull/1259⁠
    #  Counter to that, there appears to be PostgreSQL data in:
    #     /var/lib/postgresql/data (unused mount/volume)
    #  This is usually the result of upgrading the Docker image without
    #  upgrading the underlying database using "pg_upgrade" (which requires both
    #  versions).
    #  The suggested container configuration for 18+ is to place a single mount
    #  at /var/lib/postgresql which will then place PostgreSQL data in a
    #  subdirectory, allowing usage of "pg_upgrade --link" without mount point
    #  boundary issues.
    #  See https://github.com/docker-library/postgres/issues/37⁠ for a (long)
    #  discussion around this process, and suggestions for how to do so.
    image: pgvector/pgvector:0.8.2-pg18-trixie
    container_name: servexa-warranty-ai-postgres-dev
    restart: unless-stopped
    environment:
      POSTGRES_DB: servexa_warranty_ai_db
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin123
      # WARNING: POSTGRES_HOST_AUTH_METHOD has been set to "trust". This will allow
      #  anyone with access to the Postgres port to access your database without
      #  a password, even if POSTGRES_PASSWORD is set. See PostgreSQL
      #  documentation about "trust":
      #  https://www.postgresql.org/docs/current/auth-trust.html⁠
      #  In Docker's default configuration, this is effectively any other
      #  container on the same system.
      #  It is not recommended to use POSTGRES_HOST_AUTH_METHOD=trust. Replace
      #  it with "-e POSTGRES_PASSWORD=password" instead to set a password in
      #  "docker run".
      # POSTGRES_HOST_AUTH_METHOD: trust
    ports:
      - "5436:5432"
    volumes:
      - postgres_dev_data:/var/lib/postgresql
      - ../../packages/db/docker/postgres/init-vector.sql:/docker-entrypoint-initdb.d/init-vector.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d servexa_warranty_ai_db"]
      interval: 5s
      timeout: 5s
      retries: 5
    logging:
      options:
        max-size: "10m"
        max-file: "3"

  redis:
    image: redis:8.2.2-alpine3.22
    container_name: servexa_warranty_ai_redis_dev
    restart: unless-stopped
    ports:
      - "6381:6379"
    volumes:
      - redis_dev_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "PING"]
      interval: 10s
      timeout: 5s
      retries: 3

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: servexa-warranty-ai-pgadmin-dev
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@servexa-warranty-ai.com
      PGADMIN_DEFAULT_PASSWORD: admin123
      PGADMIN_CONFIG_SERVER_MODE: "False"
    ports:
      - "8081:80"
    volumes:
      - pgadmin_dev_data:/var/lib/pgadmin
    depends_on:
      - postgres

  server:
    build:
      context: ../..
      dockerfile: apps/server/Dockerfile.dev
      target: development
    container_name: servexa-warranty-ai-server-dev
    restart: unless-stopped
    env_file:
      - ../../apps/server/.env
    environment:
      # Override host-only URLs for in-compose networking (adjust in .env if needed).
      DATABASE_URL: postgresql://admin:admin123@postgres:5432/servexa_warranty_ai_db?schema=public
      REDIS_URL: redis://redis:6379
    ports:
      - "3000:3000"
      - "9229:9229"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ../../apps/server/src:/app/apps/server/src
      - ../../packages:/app/packages
      - server_node_modules:/app/node_modules
      - server_uploads:/app/apps/server/uploads
      - server_logs:/app/apps/server/logs
    user: "1001:1001"
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "const p=Number(process.env.PORT||3000);fetch(`http://127.0.0.1:${p}/`).then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 10s
      start_period: 90s
      retries: 3

volumes:
  postgres_dev_data:
    driver: local
  pgadmin_dev_data:
    driver: local
  redis_dev_data:
    driver: local
  server_node_modules:
    driver: local
  server_uploads:
    driver: local
  server_logs:
    driver: local

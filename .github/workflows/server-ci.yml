name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

jobs:
  server-ci:
    name: Server CI
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci -d ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      NODE_ENV: test
      PORT: "3000"
      # https://github.blog/changelog/2025-09-19-deprecation-of-node-20-on-github-actions-runners
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
      # prisma generate (packages/db postinstall) only needs a valid URL shape, not a live DB.
      DATABASE_URL: postgresql://ci:ci@127.0.0.1:5432/ci?schema=public
      CORS_ORIGIN: http://localhost:3001
      CORS_ORIGIN_WEB: http://localhost:3001
      TEMP_REFRESH_TOKEN_SECRET: ci-test-refresh-token-secret
      REDIS_HOST: 127.0.0.1
      REDIS_PORT: "6379"

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm --filter server check-types

      - name: Test
        run: pnpm --filter server test

      - name: Build server
        run: pnpm --filter server build

      - name: Apply database migrations
        run: pnpm --filter server exec prisma migrate deploy

      - name: Smoke test production start
        working-directory: apps/server
        run: |
          node dist/index.mjs &
          pid=$!
          for i in $(seq 1 30); do
            if curl -sf "http://127.0.0.1:${PORT}/health" >/dev/null; then
              kill "$pid" 2>/dev/null || true
              wait "$pid" 2>/dev/null || true
              exit 0
            fi
            sleep 1
          done
          kill "$pid" 2>/dev/null || true
          wait "$pid" 2>/dev/null || true
          echo "Server did not respond on port ${PORT}"
          exit 1
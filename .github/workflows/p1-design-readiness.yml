name: P1 Design Readiness

permissions:
  contents: read
  id-token: write
  attestations: write

on:
  pull_request:
    paths:
      - "documents/adr/ADR-014-*"
      - "documents/production-readiness/P1_*"
      - "documents/production-readiness/p1*"
      - "scripts/p1*.mjs"
      - "scripts/evidence-*.mjs"
      - "scripts/validate-p1-gates*"
      - "package.json"
  push:
    branches: [dev]
  workflow_dispatch:

jobs:
  design-evidence:
    name: P1D design conformance and gate hierarchy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.28.1
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Generate P1D evidence registry
        run: node scripts/p1d.mjs proof
      - name: Validate P1D readiness and blocked runtime tracks
        run: node scripts/p1d.mjs gate
      - name: Run gate regression tests
        run: node --test scripts/validate-p1-gates.test.mjs
      - name: Build deterministic evidence bundle
        run: node scripts/evidence-bundle.mjs p1d
      - name: Attest evidence bundle with GitHub OIDC
        uses: actions/attest@v4
        with:
          subject-path: .p1d/evidence/bundle.json
      - name: Preserve P1D evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: p1d-evidence-${{ github.sha }}-${{ github.run_attempt }}
          path: .p1d/evidence/
          if-no-files-found: error
          retention-days: 30


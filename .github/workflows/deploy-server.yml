name: Deploy Server to VM

on:
  workflow_run:
    workflows:
      - Build Server Image
    types:
      - completed

jobs:
  deploy:
    name: Deploy apps/server
    runs-on: ubuntu-latest

    if: ${{ github.event.workflow_run.conclusion == 'success' }}

    steps:
      # - name: Validate SSH Key
      #   run: |
      #     cat > key << 'EOF'
      #     ${{ secrets.VM_SSH_KEY }}
      #     EOF
      
      #     chmod 600 key
      
      #     ssh-keygen -lf key
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USER }}
          key: ${{ secrets.VM_SSH_KEY }}
          port: ${{ secrets.VM_PORT }}
          debug: true
          script: |
            set -e

            cd /opt/servexa/servexa-warranty-ai

            git config --global --add safe.directory /opt/servexa/servexa-warranty-ai

            git fetch origin main
            git reset --hard origin/main

            echo "Pull latest server image"
            docker compose --env-file .env.production -f docker-compose.prod.yml pull server
            echo "Start postgres and server"
            docker compose --env-file .env.production -f docker-compose.prod.yml up -d postgres server

            echo "Docker status"
            docker ps -a

            echo "Server logs"
            docker logs -n 150 servexa-server || true

            echo "Wait for server health"
            for i in {1..5}; do
              if curl -fsS http://127.0.0.1:3000/health; then
                echo "Server is healthy"
                docker image prune -f
                exit 0
              fi

              echo "Waiting for server... attempt $i"
              sleep 3
            done

            echo "Final server logs"
            docker logs -n 300 servexa-server || true

            exit 1
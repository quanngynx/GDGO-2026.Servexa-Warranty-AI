# On-premise Postgres (pgvector) for production / staging hosts.
# Start: pnpm --filter @servexa-warranty-ai/db db:start:production
#
# Security (OWASP Docker):
# - Digest-pinned image (bookworm stable, not trixie testing) — see docker/postgres/image.lock
# - File-based secrets (RULE #12), localhost-only publish, no-new-privileges
# - Dropped Linux capabilities, init reaper, PID/memory limits, internal network (no egress)
# Populate packages/db/secrets/*.txt before first run (see secrets/README.md).

services:
  postgres:
    image: pgvector/pgvector:0.8.2-pg18-bookworm@sha256:42e7f6b4e1eceb02ff14e3e6bc6108bbe259abbe83879dc1845d0da1ddeb555d
    pull_policy: missing
    container_name: servexa-warranty-ai-db-postgres
    restart: unless-stopped
    init: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - FOWNER
      - SETGID
      - SETUID
    shm_size: 256mb
    pids_limit: 200
    mem_limit: 2g
    cpus: 2
    environment:
      POSTGRES_USER_FILE: "${DATABASE_USERNAME}"
      POSTGRES_PASSWORD_FILE: "${DATABASE_PASSWORD}"
      POSTGRES_DB_FILE: "${DATABASE_NAME}"
      POSTGRES_PORT_FILE: "${DATABASE_PORT}"
      POSTGRES_HOST_FILE: "${DATABASE_HOST}"
    secrets:
      - postgres_user
      - postgres_password
      - postgres_db
    ports:
      # Host port must match secrets/postgres_port.txt (default 5436).
      - "127.0.0.1:${POSTGRES_HOST_PORT:-5436}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
      - ./docker/postgres/init-vector.sql:/docker-entrypoint-initdb.d/init-vector.sql:ro
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U \"$$(cat /run/secrets/postgres_user)\" -d \"$$(cat /run/secrets/postgres_db)\"",
        ]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - db_internal

  server:
    build:
      context: .
      dockerfile: apps/server/Dockerfile
    container_name: servexa-warranty-ai-server
    restart: unless-stopped
    env_file:
      - apps/server/.env.production
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - server_internal
    ports:
      - "${PORT}:3000"

networks:
  db_internal:
    internal: true

volumes:
  postgres_data:
    driver: local

apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  name: ai-worker-service
spec:
  template:
    spec:
      serviceAccountName: ai-worker-sa
      containers:
        - image: gcr.io/PROJECT_ID/ai-worker-service:latest
          env:
            - name: REDIS_URL
              valueFrom:
                secretKeyRef:
                  name: ai-redis-url
                  key: url
            - name: POSTGRES_HOST
              valueFrom:
                secretKeyRef:
                  name: ai-postgres-host
                  key: host
            - name: POSTGRES_PORT
              value: '5432'
            - name: POSTGRES_DB
              value: ai_service
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: ai-postgres-user
                  key: username
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: ai-postgres-password
                  key: password

substitutions:
  _REGION: asia-southeast1
  _SERVICE_NAME: servexa-ai-services
  _VPC_NETWORK: default
  _VPC_SUBNET: default

steps:
  - name: gcr.io/cloud-builders/docker
    id: Build ai-services image
    args:
      - build
      - -f
      - apps/ai-services/Dockerfile.api
      - -t
      - gcr.io/$PROJECT_ID/servexa-ai-services:$COMMIT_SHA
      - .

  - name: gcr.io/cloud-builders/docker
    id: Push image
    args:
      - push
      - gcr.io/$PROJECT_ID/servexa-ai-services:$COMMIT_SHA

  - name: gcr.io/google.com/cloudsdktool/cloud-sdk
    id: Deploy to Cloud Run
    entrypoint: gcloud
    args:
      - run
      - deploy
      - ${_SERVICE_NAME}
      - --image=gcr.io/$PROJECT_ID/servexa-ai-services:$COMMIT_SHA
      - --region=${_REGION}
      - --platform=managed
      - --allow-unauthenticated
      - --port=8081
      - --memory=1Gi
      - --cpu=1
      - --min-instances=0
      - --max-instances=1
      - --vpc-network=${_VPC_NETWORK}
      - --vpc-subnet=${_VPC_SUBNET}
      - --vpc-egress=private-ranges-only
      - --set-env-vars=APP_ENV=production
      - --set-secrets=DATABASE_URL=AI_DATABASE_URL:latest,AI_REDIS_URL=AI_REDIS_URL:latest,GEMINI_API_KEY=GEMINI_API_KEY:latest

images:
  - gcr.io/$PROJECT_ID/servexa-ai-services:$COMMIT_SHA

options:
  logging: CLOUD_LOGGING_ONLY
# Local Postgres (pgvector) + Redis for `pnpm db:start` from repo root
services:
  postgres:
    image: pgvector/pgvector:0.8.2-pg18-trixie
    container_name: servexa-warranty-ai-db-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: servexa_warranty_ai_db
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin123
    ports:
      - "5436:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
      - ./docker/postgres/init-vector.sql:/docker-entrypoint-initdb.d/init-vector.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d servexa_warranty_ai_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:8.2.2-alpine3.22
    container_name: servexa-warranty-ai-db-redis
    restart: unless-stopped
    ports:
      - "6381:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "PING"]
      interval: 10s
      timeout: 5s
      retries: 3

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local

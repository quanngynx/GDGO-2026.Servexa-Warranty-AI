name: servexa-warranty-ai

services:
  postgres:
    image: postgres
    container_name: servexa-warranty-ai-postgres
    environment:
      POSTGRES_DB: servexa-warranty-ai
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
    ports:
      - "5432:5432"
    volumes:
      - servexa-warranty-ai_postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  servexa-warranty-ai_postgres_data:

# Local Postgres (pgvector) + Redis for `pnpm db:start` from repo root
services:
  postgres:
    image: pgvector/pgvector:0.8.2-pg18-trixie@sha256:42e7f6b4e1eceb02ff14e3e6bc6108bbe259abbe83879dc1845d0da1ddeb555d
    container_name: servexa-warranty-ai-db-postgres
    restart: unless-stopped
    env_file:
      - .env
    environment:
      POSTGRES_DB: ${DATABASE_NAME}
      POSTGRES_PORT: ${DATABASE_PORT}
      POSTGRES_USER: ${DATABASE_USERNAME}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD}
    ports:
      - "${DATABASE_PORT}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
      - ./docker/postgres/init-vector.sql:/docker-entrypoint-initdb.d/init-vector.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DATABASE_USERNAME} -d ${DATABASE_NAME}"]
      interval: 5s
      timeout: 5s
      retries: 3
  
  redis:
    image: redis:8.2.2-alpine3.22@sha256:59b6e694653476de2c992937ebe1c64182af4728e54bb49e9b7a6c26614d8933
    container_name: servexa_warranty_ai_redis_dev
    restart: unless-stopped
    env_file:
      - .env
    # Run as a non-root user (UID 999)
    user: "999:999"
    # Bind ONLY to localhost to prevent public internet exposure
    ports:
      - "${REDIS_HOST}:6381:6379"
    volumes:
      - redis_data:/data
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD}", "--appendonly", "yes"]
    # Prevent privilege escalation
    cap_drop:
      - ALL
    cap_add:
      - SETGID
      - SETUID
      - CHOWN
      - DAC_OVERRIDE
    # Limit resources to mitigate DoS
    deploy:
      resources:
        limits:
          cpus: '0.5'
          # Hard limit - container killed if exceeded
          memory: 512M
        reservations:
          # Soft limit - guaranteed minimum
          memory: 256M
    healthcheck:
      test: ["CMD", "redis-cli", "PING"]
      interval: 10s
      timeout: 5s
      retries: 3

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local

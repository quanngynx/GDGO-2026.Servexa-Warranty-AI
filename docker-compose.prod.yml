# Cloud VM production / staging stack.
# Start: docker compose -f docker-compose.prod.yml up -d
#
# Security (OWASP Docker Cheat Sheet):
# - Digest-pinned images — see each Dockerfile and image tag
# - no-new-privileges, dropped Linux capabilities, PID/memory limits
# - Internal networks: only the web (Nginx) container is exposed to the internet
# - Server is not port-published — traffic flows through Nginx reverse proxy
# Populate packages/db/secrets/*.txt before first run (see secrets/README.md).

services:
  postgres:
    image: pgvector/pgvector:0.8.2-pg18-trixie@sha256:42e7f6b4e1eceb02ff14e3e6bc6108bbe259abbe83879dc1845d0da1ddeb555d
    container_name: servexa-warranty-ai-db-postgres
    restart: unless-stopped
    env_file:
      - .env.production
    init: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - FOWNER
      - SETGID
      - SETUID
    shm_size: 256mb
    pids_limit: 200
    mem_limit: 2g
    cpus: 2
    environment:
      POSTGRES_DB: ${DATABASE_NAME}
      POSTGRES_USER: ${DATABASE_USERNAME}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD}
      POSTGRES_PORT: ${DATABASE_PORT}
    ports:
      - "${DATABASE_PORT}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
      - ./docker/postgres/init-vector.sql:/docker-entrypoint-initdb.d/init-vector.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DATABASE_USERNAME} -d ${DATABASE_NAME}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - db_internal

  server:
    env_file:
      - .env.production
    image: ghcr.io/${GHCR_OWNER}/${GHCR_IMAGE_NAME}:latest
    container_name: servexa-server
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      INFISICAL_PROJECT_ID: ${INFISICAL_PROJECT_ID}
      INFISICAL_SECRET_ENV: ${INFISICAL_SECRET_ENV:-prod}
      INFISICAL_SECRET_PATH: ${INFISICAL_SECRET_PATH:-/server}
      INFISICAL_API_URL: ${INFISICAL_API_URL:-https://app.infisical.com}
      INFISICAL_MACHINE_IDENTITY_ID: ${INFISICAL_MACHINE_IDENTITY_ID}
    # Server is NOT port-published — traffic flows through the web (Nginx)
    # reverse proxy. This reduces attack surface (OWASP Docker RULE #11).
    networks:
      - server_internal
      - db_internal

  # ── Web (Nginx) — OWASP-hardened SPA + reverse proxy ─────────────────
  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        VITE_SERVER_URL: ${VITE_SERVER_URL:-http://localhost:8080}
    container_name: servexa-web
    restart: unless-stopped
    depends_on:
      server:
        condition: service_healthy
    # ── OWASP Container Hardening ──────────────────────────────────────
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    # Nginx needs writable dirs for pid, cache, and logs
    tmpfs:
      - /var/cache/nginx:uid=101,gid=101
      - /var/run:uid=101,gid=101
      - /var/log/nginx:uid=101,gid=101
      - /tmp:uid=101,gid=101
      - /etc/nginx:uid=101,gid=101
    pids_limit: 100
    mem_limit: 256m
    cpus: 1
    environment:
      # Extra CSP connect-src origins (space-separated).
      # Empty = only 'self' (same-origin requests via reverse proxy).
      CSP_CONNECT_SRC: ${CSP_CONNECT_SRC:-}
    ports:
      - "${WEB_PORT:-8080}:8080"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/_health"]
      interval: 30s
      timeout: 3s
      start_period: 5s
      retries: 3
    networks:
      - server_internal

networks:
  db_internal:
    internal: true
  server_internal:
    driver: bridge

volumes:
  postgres_data:
    driver: local
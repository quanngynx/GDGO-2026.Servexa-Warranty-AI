substitutions:
  _REGION: us-central1
  _SERVICE_NAME: servexa-ai-services
  _VPC_NETWORK: default
  _VPC_SUBNET: default
  _SERVICE_ACCOUNT_NAME: servexa-cloud-build-deployer

  _APP_ENV: production
  _PORT: "8081"

  _INFISICAL_SECRET_ENV: prod
  _INFISICAL_SECRET_PATH: /ai-api
  _INFISICAL_API_URL: https://app.infisical.com
  _INFISICAL_PROJECT_ID: your-infisical-project-id
  _INFISICAL_MACHINE_IDENTITY_ID: your-infisical-machine-identity-id

steps:
  - name: gcr.io/cloud-builders/docker
    id: Build ai-services image
    args:
      - build
      - -f
      - apps/ai-services/Dockerfile.api
      - -t
      - gcr.io/$PROJECT_ID/servexa-ai-services:$COMMIT_SHA
      - .

  - name: gcr.io/cloud-builders/docker
    id: Push image
    args:
      - push
      - gcr.io/$PROJECT_ID/servexa-ai-services:$COMMIT_SHA

  - name: gcr.io/google.com/cloudsdktool/cloud-sdk
    id: Deploy to Cloud Run
    entrypoint: gcloud
    args:
      - run
      - deploy
      - ${_SERVICE_NAME}
      - --image=gcr.io/$PROJECT_ID/servexa-ai-services:$COMMIT_SHA
      - --region=${_REGION}
      - --platform=managed
      - --allow-unauthenticated
      - --port=${_PORT}
      - --memory=1Gi
      - --cpu=1
      - --min-instances=0
      - --max-instances=1
      - --vpc-network=${_VPC_NETWORK}
      - --vpc-subnet=${_VPC_SUBNET}
      - --vpc-egress=private-ranges-only
      - --service-account=${_SERVICE_ACCOUNT_NAME}@$PROJECT_ID.iam.gserviceaccount.com
      - --set-env-vars=APP_ENV=${_APP_ENV},PORT=${_PORT},SERVICE_ACCOUNT_NAME=${_SERVICE_ACCOUNT_NAME},INFISICAL_PROJECT_ID=${_INFISICAL_PROJECT_ID},INFISICAL_SECRET_ENV=${_INFISICAL_SECRET_ENV},INFISICAL_SECRET_PATH=${_INFISICAL_SECRET_PATH},INFISICAL_API_URL=${_INFISICAL_API_URL},INFISICAL_MACHINE_IDENTITY_ID=${_INFISICAL_MACHINE_IDENTITY_ID}

images:
  - gcr.io/$PROJECT_ID/servexa-ai-services:$COMMIT_SHA

options:
  logging: CLOUD_LOGGING_ONLY
global:
  scrape_interval: 5s

scrape_configs:
  - job_name: otel-collector
    static_configs:
      - targets: ["otel-collector:8889"]
  - job_name: reference-services
    metrics_path: /metrics
    static_configs:
      - targets: ["scim-reference:4100", "warranty-reference:4100", "ai-reference:4100"]
